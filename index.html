<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pytrol 3D - Fluxo CT-e</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="app-brand">
          <strong>Pytrol Analytics</strong>
          <span>Visualização experimental integrada ao Pytrol</span>
        </div>
        <nav class="mode-tabs" aria-label="Relatórios disponíveis">
          <button type="button" data-report-mode="cte" aria-selected="true">
            Fluxo CT-e
          </button>
          <button type="button" data-report-mode="operational" aria-selected="false">
            Operacional
          </button>
          <button type="button" data-report-mode="ux" aria-selected="false">
            UI/UX
          </button>
        </nav>
      </header>

      <main>
        <section id="scene-view" class="report-view">
          <div id="scene-container"></div>
          <div class="scene-panel">
            <h1>Fluxo de CT-e por filial</h1>
            <p>Altura = quantidade de CT-e. <br>Cor = valor total. <br>Passe o mouse em uma barra para detalhar.</p>
            <div class="color-legend">
              <strong>Catálogo de cores</strong>
              <div class="color-scale" aria-hidden="true"></div>
              <div class="color-legend-row">
                <span>Menor valor</span>
                <span>Valor médio</span>
                <span>Maior valor</span>
              </div>
            </div>
          </div>
        </section>

        <section id="dashboard-view" class="report-view" hidden>
          <div id="dashboard-root"></div>
        </section>
      </main>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
